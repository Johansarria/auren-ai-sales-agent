<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/>
    </marker>
    <marker id="arrSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1040" height="660" fill="#020617"/>
  <rect width="1040" height="660" fill="url(#grid)"/>

  <!-- ===== FLUJOS (detrás de los componentes) ===== -->
  <!-- Shopify <-> Agente: webhooks / Admin API -->
  <line x1="790" y1="150" x2="660" y2="250" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,4" marker-start="url(#arrRose)" marker-end="url(#arrRose)"/>
  <text x="740" y="195" font-size="8" fill="#fb7185" text-anchor="middle">webhooks · Admin API</text>
  <text x="740" y="207" font-size="8" fill="#fb7185" text-anchor="middle">(HMAC)</text>

  <!-- Interrapísimo -> Shopify -->
  <line x1="790" y1="200" x2="790" y2="152" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrSlate)"/>
  <text x="808" y="180" font-size="8" fill="#94a3b8">guía de envío</text>

  <!-- Agente -> Supabase -->
  <line x1="700" y1="400" x2="780" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="730" y="435" font-size="8" fill="#94a3b8" text-anchor="middle">clientes · pedidos</text>
  <text x="730" y="447" font-size="8" fill="#94a3b8" text-anchor="middle">eventos (RLS)</text>

  <!-- Agente -> WhatsApp Cloud API -->
  <line x1="380" y1="400" x2="215" y2="470" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="290" y="435" font-size="8" fill="#94a3b8" text-anchor="middle">plantillas aprobadas</text>
  <text x="290" y="447" font-size="8" fill="#94a3b8" text-anchor="middle">(guía · escalera)</text>

  <!-- WhatsApp Cloud API -> Cliente -->
  <line x1="120" y1="470" x2="145" y2="150" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="315" font-size="8" fill="#94a3b8">WABA</text>

  <!-- ===== FILA 1: CLIENTE ===== -->
  <rect x="60" y="70" width="230" height="80" rx="6" fill="#0f172a"/>
  <rect x="60" y="70" width="230" height="80" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="175" y="100" font-size="12" fill="#22d3ee" text-anchor="middle" font-weight="bold">CLIENTE</text>
  <text x="175" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">WhatsApp · teléfono móvil</text>
  <text x="175" y="133" font-size="8" fill="#64748b" text-anchor="middle">compra en la tienda web</text>

  <!-- ===== FILA 1: SHOPIFY ===== -->
  <rect x="640" y="70" width="300" height="80" rx="6" fill="#0f172a"/>
  <rect x="640" y="70" width="300" height="80" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="790" y="100" font-size="12" fill="#fbbf24" text-anchor="middle" font-weight="bold">SHOPIFY</text>
  <text x="790" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">aurenstore.store</text>
  <text x="790" y="133" font-size="8" fill="#64748b" text-anchor="middle">webhooks: pedido enviado · checkout abandonado</text>

  <!-- Interrapísimo -->
  <rect x="640" y="200" width="300" height="50" rx="6" fill="#0f172a"/>
  <rect x="640" y="200" width="300" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="790" y="222" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="bold">INTERRAPÍSIMO</text>
  <text x="790" y="238" font-size="8" fill="#64748b" text-anchor="middle">logística · genera guía al despachar</text>

  <!-- ===== FILA 2: AGENTE (núcleo) ===== -->
  <rect x="260" y="250" width="520" height="150" rx="8" fill="#0f172a"/>
  <rect x="260" y="250" width="520" height="150" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="2"/>
  <text x="520" y="278" font-size="13" fill="#34d399" text-anchor="middle" font-weight="bold">AGENTE AUTÓNOMO DE IA</text>
  <text x="520" y="294" font-size="9" fill="#94a3b8" text-anchor="middle">observa eventos → decide con contexto → ejecuta acciones reales</text>

  <rect x="280" y="308" width="150" height="40" rx="5" fill="#0f172a"/>
  <rect x="280" y="308" width="150" height="40" rx="5" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="355" y="323" font-size="9" fill="#a7f3d0" text-anchor="middle" font-weight="bold">HERMES</text>
  <text x="355" y="338" font-size="8" fill="#94a3b8" text-anchor="middle">orquestación</text>

  <rect x="445" y="308" width="150" height="40" rx="5" fill="#0f172a"/>
  <rect x="445" y="308" width="150" height="40" rx="5" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="520" y="323" font-size="9" fill="#a7f3d0" text-anchor="middle" font-weight="bold">LLM</text>
  <text x="520" y="338" font-size="8" fill="#94a3b8" text-anchor="middle">razonamiento</text>

  <rect x="610" y="308" width="150" height="40" rx="5" fill="#0f172a"/>
  <rect x="610" y="308" width="150" height="40" rx="5" fill="rgba(6,78,59,0.6)" stroke="#34d399" stroke-width="1"/>
  <text x="685" y="323" font-size="9" fill="#a7f3d0" text-anchor="middle" font-weight="bold">PYTHON · DOCKER</text>
  <text x="685" y="338" font-size="8" fill="#94a3b8" text-anchor="middle">VPS Linux</text>

  <text x="520" y="375" font-size="8" fill="#64748b" text-anchor="middle">desencadenantes: order/fulfilled · checkout abandonado · lead nuevo</text>

  <!-- ===== FILA 3: WHATSAPP CLOUD API ===== -->
  <rect x="60" y="470" width="280" height="90" rx="6" fill="#0f172a"/>
  <rect x="60" y="470" width="280" height="90" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="200" y="500" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="bold">WHATSAPP CLOUD API</text>
  <text x="200" y="518" font-size="9" fill="#94a3b8" text-anchor="middle">Meta Business · WABA</text>
  <text x="200" y="533" font-size="8" fill="#64748b" text-anchor="middle">plantillas aprobadas · transaccionales y promocionales</text>
  <text x="200" y="547" font-size="8" fill="#64748b" text-anchor="middle">Pixel · medición de conversión</text>

  <!-- ===== FILA 3: SUPABASE ===== -->
  <rect x="640" y="470" width="300" height="90" rx="6" fill="#0f172a"/>
  <rect x="640" y="470" width="300" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="790" y="500" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="bold">SUPABASE</text>
  <text x="790" y="518" font-size="9" fill="#94a3b8" text-anchor="middle">PostgreSQL · Row Level Security</text>
  <text x="790" y="533" font-size="8" fill="#64748b" text-anchor="middle">clientes (teléfono) · pedidos enlazados</text>
  <text x="790" y="547" font-size="8" fill="#64748b" text-anchor="middle">clics web · leads con UTM</text>

  <!-- ===== LEYENDA ===== -->
  <line x1="60" y1="600" x2="980" y2="600" stroke="#1e293b" stroke-width="1"/>
  <rect x="60" y="615" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="78" y="625" font-size="9" fill="#94a3b8">Cliente / Frontend</text>
  <rect x="200" y="615" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="218" y="625" font-size="9" fill="#94a3b8">Shopify / Cloud</text>
  <rect x="340" y="615" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.2"/>
  <text x="358" y="625" font-size="9" fill="#94a3b8">Agente IA / Backend</text>
  <rect x="490" y="615" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="508" y="625" font-size="9" fill="#94a3b8">Supabase / Datos</text>
  <rect x="620" y="615" width="12" height="12" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="638" y="625" font-size="9" fill="#94a3b8">Externo (WABA · Interrapísimo)</text>
  <line x1="800" y1="621" x2="826" y2="621" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="832" y="625" font-size="9" fill="#94a3b8">Seguridad (HMAC · RLS)</text>
</svg>
